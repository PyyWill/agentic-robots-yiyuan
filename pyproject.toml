[project]
name = "overhyp"
version = "0.1.0"
description = "Grounded generalization for agentic robots: Kemp et al. (2007) overhypotheses over robot skill essences"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
baseline = ["requests>=2.31"]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["overhyp"]
